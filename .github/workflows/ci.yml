name: CI

# Runs on every pull request and every change to main (Constitution
# Principles VIII and IX: evidence over assertion; fixes are demonstrated).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          # Raspberry Pi OS (Debian 12) ships Python 3.11
          python-version: "3.11"
      - name: Install the same libraries the Pi uses
        run: python -m pip install flask requests cryptography
      - name: Run the test suite
        run: python tests/test_tosslist.py

  code-checks:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
      - name: pyflakes
        run: |
          python -m pip install pyflakes
          python -m pyflakes *.py tests/*.py

  installer-check:
    name: Installer check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: shellcheck the scripts
        run: shellcheck -x install.sh update.sh scripts/*.sh
